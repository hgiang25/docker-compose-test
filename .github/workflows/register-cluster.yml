name: Register Clusters To ArgoCD

on:
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1

concurrency:
  group: register-clusters
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================
      - uses: actions/checkout@v4

      # =========================================================
      # KUBECTL
      # =========================================================
      - uses: azure/setup-kubectl@v4

      # =========================================================
      # INSTALL ARGOCD CLI
      # =========================================================
      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64

          chmod +x argocd

          sudo mv argocd /usr/local/bin/

          argocd version --client

      # =========================================================
      # AWS LOGIN
      # =========================================================
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # =========================================================
      # CONNECT MANAGEMENT CLUSTER
      # =========================================================
      - name: Connect Management Cluster
        run: |
          aws eks update-kubeconfig \
            --name management-cluster \
            --region $AWS_REGION

      # =========================================================
      # WAIT CLUSTER ACTIVE
      # =========================================================
      - name: Wait Cluster Active
        run: |
          aws eks wait cluster-active \
            --name management-cluster \
            --region $AWS_REGION

      # =========================================================
      # WAIT NODES READY
      # =========================================================
      - name: Wait Nodes Ready
        run: |
          kubectl wait \
            --for=condition=Ready nodes \
            --all \
            --timeout=900s

      # =========================================================
      # WAIT ARGOCD SERVER
      # =========================================================
      - name: Wait ArgoCD Server
        run: |
          kubectl rollout status deployment/argocd-server \
            -n argocd \
            --timeout=900s

      # =========================================================
      # WAIT ARGOCD REPOSERVER
      # =========================================================
      - name: Wait ArgoCD RepoServer
        run: |
          kubectl rollout status deployment/argocd-repo-server \
            -n argocd \
            --timeout=900s

      # =========================================================
      # WAIT ARGOCD APPLICATION CONTROLLER
      # =========================================================
      - name: Wait ArgoCD Application Controller
        run: |
          kubectl rollout status statefulset/argocd-application-controller \
            -n argocd \
            --timeout=900s

      # =========================================================
      # GET ADMIN PASSWORD
      # =========================================================
      - name: Get Admin Password
        run: |
          PASSWORD=$(kubectl -n argocd get secret argocd-initial-admin-secret \
            -o jsonpath="{.data.password}" | base64 -d)

          echo "ARGO_PASSWORD=$PASSWORD" >> $GITHUB_ENV

      # =========================================================
      # START PORT FORWARD
      # =========================================================
      - name: Start Port Forward
        run: |
          nohup kubectl port-forward svc/argocd-server \
            -n argocd \
            8080:80 \
            > /tmp/argocd-portforward.log 2>&1 &

          echo "Waiting port-forward..."

          for i in {1..30}; do
            nc -z 127.0.0.1 8080 && break

            sleep 2
          done

          echo "=== PORT FORWARD LOG ==="
          cat /tmp/argocd-portforward.log || true

      # =========================================================
      # TEST HTTP
      # =========================================================
      - name: Test ArgoCD Endpoint
        run: |
          curl -v http://127.0.0.1:8080/api/version

      # =========================================================
      # LOGIN ARGOCD
      # =========================================================
      - name: Login ArgoCD
        run: |
          argocd login 127.0.0.1:8080 \
            --username admin \
            --password "$ARGO_PASSWORD" \
            --insecure \
            --grpc-web

      # =========================================================
      # VERIFY LOGIN
      # =========================================================
      - name: Verify Login
        run: |
          argocd account get-user-info \
            --grpc-web

      # =========================================================
      # CONNECT DEV CLUSTER KUBECONFIG
      # =========================================================
      - name: Connect Dev Cluster
        run: |
          aws eks update-kubeconfig \
            --name dev-cluster \
            --region $AWS_REGION \
            --alias dev-cluster

      # =========================================================
      # REGISTER DEV CLUSTER
      # =========================================================
      - name: Register Dev Cluster
        run: |
          argocd cluster add dev-cluster \
            --yes \
            --insecure \
            --grpc-web

      # =========================================================
      # VERIFY CLUSTERS
      # =========================================================
      - name: Verify Clusters
        run: |
          argocd cluster list \
            --grpc-web
