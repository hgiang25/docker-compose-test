name: Register EKS Cluster To ArgoCD (Production Grade)

on:
  workflow_dispatch:

jobs:
  register:
    name: Register Clusters
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-southeast-1

    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # AWS AUTH
      # =========================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ap-southeast-1

      # =========================================================
      # INSTALL TOOLS
      # =========================================================
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/
          argocd version --client

      # =========================================================
      # CONNECT MANAGEMENT CLUSTER
      # =========================================================
      - name: Connect management cluster
        run: |
          aws eks update-kubeconfig \
            --name management-cluster \
            --region $AWS_REGION

          kubectl config current-context

      # =========================================================
      # WAIT ARGOCD FULL READY
      # =========================================================
      - name: Wait ArgoCD Ready
        run: |
          kubectl rollout status deployment/argocd-server \
            -n argocd --timeout=600s

          echo "Pods:"
          kubectl get pods -n argocd

      # =========================================================
      # GET ADMIN PASSWORD
      # =========================================================
      - name: Get ArgoCD Password
        run: |
          PASSWORD=$(kubectl -n argocd get secret argocd-initial-admin-secret \
            -o jsonpath="{.data.password}" | base64 -d)

          echo "ARGO_PASSWORD=$PASSWORD" >> $GITHUB_ENV

      # =========================================================
      # START PORT-FORWARD & LOGIN (CRITICAL FIX - RESOLVE ALB ISSUE)
      # =========================================================
      - name: Port-Forward & Login ArgoCD
        run: |
          echo "Starting secure background port-forward directly to cluster..."
          # Mở port-forward ngầm (background) tới cổng 8080 của runner
          kubectl port-forward svc/argocd-server -n argocd 8080:443 > /dev/null 2>&1 &

          # Đợi 5 giây để cổng mạng tunnel sẵn sàng
          sleep 5

          echo "Logging into ArgoCD via local port-forward..."
          set +e
          for i in {1..5}; do
            # Đi qua localhost:8080 nên không bị chặn hoặc bóp bởi AWS ALB cổng 80
            argocd login localhost:8080 \
              --username admin \
              --password "$ARGO_PASSWORD" \
              --insecure

            if [ $? -eq 0 ]; then
              echo "LOGIN SUCCESSFUL VIA PORT-FORWARD"
              exit 0
            fi

            echo "Retry local login $i..."
            sleep 3
          done

          echo "Local login failed"
          exit 1

      # =========================================================
      # REGISTER DEV CLUSTER
      # =========================================================
      - name: Register Dev Cluster
        run: |
          # 1. Tạo ngữ cảnh kubeconfig cho Dev Cluster
          aws eks update-kubeconfig \
            --name dev-cluster \
            --region $AWS_REGION \
            --alias dev-cluster

          # 2. Chuyển ngữ cảnh hiện tại về lại Management để chạy lệnh add
          # (Vì lệnh 'argocd cluster add' cần đọc thông tin context của dev-cluster 
          # nhưng lệnh gọi CLI vẫn phải bắn tới địa chỉ localhost:8080 của management)
          kubectl config use-context arn:aws:eks:ap-southeast-1:248195880649:cluster/management-cluster

          echo "Registering dev-cluster to ArgoCD..."
          argocd cluster add dev-cluster \
            --yes \
            --insecure

      # =========================================================
      # OPTIONAL PROD
      # =========================================================
      - name: Register Prod Cluster
        continue-on-error: true
        run: |
          # 1. Tạo ngữ cảnh cho Prod Cluster
          aws eks update-kubeconfig \
            --name prod-cluster \
            --region $AWS_REGION \
            --alias prod-cluster

          # 2. Quay về context Management 
          kubectl config use-context arn:aws:eks:ap-southeast-1:248195880649:cluster/management-cluster

          echo "Registering prod-cluster to ArgoCD..."
          argocd cluster add prod-cluster \
            --yes \
            --insecure

      # =========================================================
      # FINAL VERIFY
      # =========================================================
      - name: Verify Clusters
        run: |
          echo "FINAL CLUSTER LIST:"
          argocd cluster list --insecure
