name: Register EKS Cluster To ArgoCD

on:
  workflow_dispatch:

jobs:
  register:
    name: Register Clusters
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-southeast-1

    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # AWS AUTH
      # =========================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ap-southeast-1

      # =========================================================
      # INSTALL KUBECTL
      # =========================================================
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      # =========================================================
      # INSTALL ARGOCD CLI
      # =========================================================
      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64

          chmod +x argocd
          sudo mv argocd /usr/local/bin/

          argocd version --client

      # =========================================================
      # CONNECT MANAGEMENT CLUSTER
      # =========================================================
      - name: Connect management cluster
        run: |
          aws eks update-kubeconfig \
            --name management-cluster \
            --region $AWS_REGION

          kubectl config current-context

      # =========================================================
      # WAIT ARGOCD READY
      # =========================================================
      - name: Wait ArgoCD Ready
        run: |
          kubectl rollout status deployment/argocd-server \
            -n argocd \
            --timeout=600s

          kubectl get pods -n argocd
          kubectl get svc -n argocd

      # =========================================================
      # GET ARGOCD PASSWORD
      # =========================================================
      - name: Get ArgoCD Password
        run: |
          PASSWORD=$(kubectl -n argocd get secret argocd-initial-admin-secret \
            -o jsonpath="{.data.password}" | base64 -d)

          echo "ARGO_PASSWORD=$PASSWORD" >> $GITHUB_ENV

      # =========================================================
      # LOGIN + REGISTER DEV CLUSTER
      # =========================================================
      - name: Register Dev Cluster
        run: |
          set -euo pipefail

          echo "Starting ArgoCD port-forward..."

          kubectl port-forward svc/argocd-server \
            -n argocd \
            --address 127.0.0.1 \
            8080:443 \
            > /tmp/argocd-portforward.log 2>&1 &

          PF_PID=$!

          cleanup() {
            echo "Cleaning up..."
            kill $PF_PID || true
          }

          trap cleanup EXIT

          echo "Waiting for port-forward..."

          for i in {1..30}; do
            if nc -z 127.0.0.1 8080; then
              echo "Port-forward established"
              break
            fi

            sleep 5
          done

          echo "===== PORT FORWARD LOG ====="
          cat /tmp/argocd-portforward.log || true

          echo "Generating auth token..."

          ARGO_TOKEN=$(argocd account generate-token \
            --server 127.0.0.1:8080 \
            --insecure \
            --grpc-web \
            --username admin \
            --password "$ARGO_PASSWORD")

          echo "Token generated"

          export ARGOCD_AUTH_TOKEN=$ARGO_TOKEN

          echo "Configure dev kubeconfig..."

          aws eks update-kubeconfig \
            --name dev-cluster \
            --region $AWS_REGION \
            --alias dev-cluster

          kubectl config get-contexts

          echo "Register dev cluster..."

          argocd cluster add dev-cluster \
            --yes \
            --server 127.0.0.1:8080 \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --insecure \
            --grpc-web

          echo "Verify clusters..."

          argocd cluster list \
            --server 127.0.0.1:8080 \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --insecure \
            --grpc-web

      # =========================================================
      # OPTIONAL PROD CLUSTER
      # =========================================================
      - name: Register Prod Cluster
        continue-on-error: true
        run: |
          set -euo pipefail

          echo "Starting ArgoCD port-forward..."

          kubectl port-forward svc/argocd-server \
            -n argocd \
            --address 127.0.0.1 \
            8080:443 \
            > /tmp/argocd-portforward-prod.log 2>&1 &

          PF_PID=$!

          cleanup() {
            kill $PF_PID || true
          }

          trap cleanup EXIT

          for i in {1..30}; do
            if nc -z 127.0.0.1 8080; then
              echo "Port-forward established"
              break
            fi

            sleep 5
          done

          argocd login 127.0.0.1:8080 \
            --username admin \
            --password "$ARGO_PASSWORD" \
            --insecure \
            --grpc-web

          aws eks update-kubeconfig \
            --name prod-cluster \
            --region $AWS_REGION \
            --alias prod-cluster

          argocd cluster add prod-cluster \
            --yes \
            --insecure \
            --grpc-web

      # =========================================================
      # VERIFY CLUSTERS
      # =========================================================
      - name: Verify Registered Clusters
        run: |
          set -euo pipefail

          kubectl port-forward svc/argocd-server \
            -n argocd \
            --address 127.0.0.1 \
            8080:443 \
            > /tmp/argocd-portforward-verify.log 2>&1 &

          PF_PID=$!

          cleanup() {
            kill $PF_PID || true
          }

          trap cleanup EXIT

          for i in {1..30}; do
            if nc -z 127.0.0.1 8080; then
              echo "Port-forward established"
              break
            fi

            sleep 5
          done

          argocd login 127.0.0.1:8080 \
            --username admin \
            --password "$ARGO_PASSWORD" \
            --insecure \
            --grpc-web

          echo "===== REGISTERED CLUSTERS ====="

          argocd cluster list \
            --insecure \
            --grpc-web
