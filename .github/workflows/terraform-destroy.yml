name: Full AWS Infrastructure Destroy

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY to confirm"
        required: true
        default: "NO"

env:
  AWS_REGION: ap-southeast-1

concurrency:
  group: terraform-infra
  cancel-in-progress: false

jobs:
  destroy:
    if: github.event.inputs.confirm_destroy == 'DESTROY'

    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # AWS LOGIN
      # =========================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # =========================================================
      # SETUP TERRAFORM
      # =========================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # =========================================================
      # SETUP KUBECTL
      # =========================================================
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      # =========================================================
      # CONNECT MANAGEMENT CLUSTER
      # =========================================================
      - name: Connect management cluster
        continue-on-error: true
        run: |
          aws eks update-kubeconfig \
            --name management-cluster \
            --region $AWS_REGION || true

      # =========================================================
      # DELETE ARGOCD APPLICATIONS NORMALLY FIRST
      # Do not remove finalizers before deleting apps.
      # Finalizers help ArgoCD prune child resources.
      # =========================================================
      - name: Delete ArgoCD applications
        continue-on-error: true
        run: |
          kubectl delete application root-app \
            -n argocd \
            --timeout=180s || true

          kubectl delete application voting-dev \
            -n argocd \
            --timeout=180s || true

          kubectl delete application voting-prod \
            -n argocd \
            --timeout=180s || true

          kubectl delete applications \
            --all \
            -n argocd \
            --timeout=180s || true

      # =========================================================
      # FALLBACK: REMOVE ARGOCD FINALIZERS ONLY IF STUCK
      # =========================================================
      - name: Remove stuck ArgoCD finalizers
        continue-on-error: true
        run: |
          kubectl get applications.argoproj.io \
            -n argocd \
            -o name 2>/dev/null | while read app; do

            kubectl patch $app \
              -n argocd \
              --type merge \
              -p '{"metadata":{"finalizers":[]}}' || true
          done

      # =========================================================
      # CLEAN DEV APPLICATION SERVICES / PVC
      # This is only a safety cleanup before Terraform destroys infra.
      # =========================================================
      - name: Clean dev cluster workloads
        continue-on-error: true
        run: |
          aws eks update-kubeconfig \
            --name dev-cluster \
            --region $AWS_REGION || true

          kubectl delete svc \
            --all \
            -n dev \
            --timeout=180s || true

          kubectl delete pvc \
            --all \
            -n dev \
            --timeout=180s || true

          kubectl delete namespace dev \
            --timeout=180s || true

      # =========================================================
      # CLEAN PROD APPLICATION SERVICES / PVC
      # This is only a safety cleanup before Terraform destroys infra.
      # =========================================================
      - name: Clean prod cluster workloads
        continue-on-error: true
        run: |
          aws eks update-kubeconfig \
            --name prod-cluster \
            --region $AWS_REGION || true

          kubectl delete svc \
            --all \
            -n prod \
            --timeout=180s || true

          kubectl delete pvc \
            --all \
            -n prod \
            --timeout=180s || true

          kubectl delete namespace prod \
            --timeout=180s || true

      # =========================================================
      # WAIT A LITTLE FOR LOADBALANCER CONTROLLER CLEANUP
      # =========================================================
      - name: Wait before Terraform destroy
        run: |
          sleep 60

      # =========================================================
      # DESTROY PEERING FIRST IF IT EXISTS
      # Peering depends on management/dev VPCs, so destroy before VPCs.
      # =========================================================
      - name: Destroy VPC peering
        working-directory: infrastructure/environments/add_on-vpc_peering
        continue-on-error: true
        run: |
          terraform init
          terraform destroy -auto-approve || true

      # =========================================================
      # DESTROY ARGOCD CLUSTER REGISTRATION
      # This stack depends on management/dev/prod remote states.
      # Destroy before deleting clusters.
      # =========================================================
      - name: Destroy ArgoCD cluster registration
        working-directory: infrastructure/environments/management-argocd-clusters
        continue-on-error: true
        run: |
          terraform init
          terraform destroy -auto-approve || true

      # =========================================================
      # DESTROY PROD ADDONS BEFORE PROD INFRA
      # =========================================================
      - name: Destroy Prod Addons
        working-directory: infrastructure/environments/prod-addons
        continue-on-error: true
        run: |
          terraform init
          terraform destroy -auto-approve || true

      # =========================================================
      # DESTROY DEV ADDONS BEFORE DEV INFRA
      # =========================================================
      - name: Destroy Dev Addons
        working-directory: infrastructure/environments/dev-addons
        continue-on-error: true
        run: |
          terraform init
          terraform destroy -auto-approve || true

      # =========================================================
      # DESTROY MANAGEMENT ARGOCD BEFORE MANAGEMENT INFRA
      # =========================================================
      - name: Destroy Management ArgoCD
        working-directory: infrastructure/environments/management-argocd
        continue-on-error: true
        run: |
          terraform init
          terraform destroy -auto-approve || true

      # =========================================================
      # DESTROY MANAGEMENT ADDONS BEFORE MANAGEMENT INFRA
      # =========================================================
      - name: Destroy Management Addons
        working-directory: infrastructure/environments/management-addons
        continue-on-error: true
        run: |
          terraform init
          terraform destroy -auto-approve || true

      # =========================================================
      # DESTROY PROD INFRA
      # =========================================================
      - name: Destroy Prod Infrastructure
        working-directory: infrastructure/environments/prod_infra
        continue-on-error: true
        run: |
          terraform init
          terraform destroy -auto-approve || true

      # =========================================================
      # DESTROY DEV INFRA
      # =========================================================
      - name: Destroy Dev Infrastructure
        working-directory: infrastructure/environments/dev_infra
        continue-on-error: true
        run: |
          terraform init
          terraform destroy -auto-approve || true

      # =========================================================
      # DESTROY MANAGEMENT INFRA LAST
      # =========================================================
      - name: Destroy Management Infrastructure
        working-directory: infrastructure/environments/management-infra
        continue-on-error: true
        run: |
          terraform init
          terraform destroy -auto-approve || true

      # =========================================================
      # OPTIONAL CLEANUP FOR KNOWN LEFTOVERS
      # This is a fallback cleanup only for resources created by this lab.
      # It does not delete AWS managed policies.
      # =========================================================
      - name: Cleanup known leftover IAM resources
        continue-on-error: true
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          ROLES=(
            management-eks-admin-role
            management-ebs-csi-role
            management-cluster-argocd-controller
            dev-eks-admin-role
            dev-ebs-csi-role
            prod-eks-admin-role
            prod-ebs-csi-role
          )

          CUSTOM_POLICIES=(
            management-EKSAdminLimitedPolicy
            dev-EKSAdminLimitedPolicy
            prod-EKSAdminLimitedPolicy
          )

          for role in "${ROLES[@]}"; do
            echo "Cleaning role: $role"

            ATTACHED=$(aws iam list-attached-role-policies \
              --role-name $role \
              --query 'AttachedPolicies[*].PolicyArn' \
              --output text 2>/dev/null || true)

            for policy_arn in $ATTACHED; do
              echo "Detaching $policy_arn from $role"

              aws iam detach-role-policy \
                --role-name $role \
                --policy-arn $policy_arn || true
            done

            INLINE=$(aws iam list-role-policies \
              --role-name $role \
              --query 'PolicyNames[*]' \
              --output text 2>/dev/null || true)

            for policy_name in $INLINE; do
              echo "Deleting inline policy $policy_name from $role"

              aws iam delete-role-policy \
                --role-name $role \
                --policy-name $policy_name || true
            done

            aws iam delete-role \
              --role-name $role || true
          done

          for policy_name in "${CUSTOM_POLICIES[@]}"; do
            POLICY_ARN="arn:aws:iam::$ACCOUNT_ID:policy/$policy_name"

            echo "Cleaning custom policy: $POLICY_ARN"

            VERSIONS=$(aws iam list-policy-versions \
              --policy-arn $POLICY_ARN \
              --query 'Versions[?IsDefaultVersion==`false`].VersionId' \
              --output text 2>/dev/null || true)

            for version_id in $VERSIONS; do
              aws iam delete-policy-version \
                --policy-arn $POLICY_ARN \
                --version-id $version_id || true
            done

            aws iam delete-policy \
              --policy-arn $POLICY_ARN || true
          done

      # =========================================================
      # OPTIONAL CLEANUP FOR KNOWN LEFTOVER KMS ALIASES
      # Delete aliases only, not KMS keys.
      # =========================================================
      - name: Cleanup known leftover KMS aliases
        continue-on-error: true
        run: |
          aws kms delete-alias \
            --alias-name alias/eks/management-cluster \
            --region $AWS_REGION || true

          aws kms delete-alias \
            --alias-name alias/eks/dev-cluster \
            --region $AWS_REGION || true

          aws kms delete-alias \
            --alias-name alias/eks/prod-cluster \
            --region $AWS_REGION || true

      # =========================================================
      # OPTIONAL CLEANUP FOR KNOWN EKS LOG GROUPS
      # =========================================================
      - name: Cleanup known CloudWatch log groups
        continue-on-error: true
        run: |
          aws logs delete-log-group \
            --log-group-name /aws/eks/management-cluster/cluster \
            --region $AWS_REGION || true

          aws logs delete-log-group \
            --log-group-name /aws/eks/dev-cluster/cluster \
            --region $AWS_REGION || true

          aws logs delete-log-group \
            --log-group-name /aws/eks/prod-cluster/cluster \
            --region $AWS_REGION || true

      # =========================================================
      # IMPORTANT:
      # Do not destroy bootstrap backend.
      # Keep S3 state bucket and lock table for the next deployment.
      # =========================================================

      # =========================================================
      # FINAL CHECK
      # =========================================================
      - name: Remaining AWS resources
        continue-on-error: true
        run: |
          echo "==== EKS CLUSTERS ===="
          aws eks list-clusters \
            --region $AWS_REGION

          echo "==== KNOWN IAM ROLES ===="
          for role in \
            management-eks-admin-role \
            management-ebs-csi-role \
            management-cluster-argocd-controller \
            dev-eks-admin-role \
            dev-ebs-csi-role \
            prod-eks-admin-role \
            prod-ebs-csi-role
          do
            aws iam get-role \
              --role-name $role \
              --query 'Role.RoleName' \
              --output text 2>/dev/null || echo "$role deleted"
          done

          echo "==== KNOWN IAM POLICIES ===="
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          for policy in \
            management-EKSAdminLimitedPolicy \
            dev-EKSAdminLimitedPolicy \
            prod-EKSAdminLimitedPolicy
          do
            aws iam get-policy \
              --policy-arn arn:aws:iam::$ACCOUNT_ID:policy/$policy \
              --query 'Policy.PolicyName' \
              --output text 2>/dev/null || echo "$policy deleted"
          done

          echo "==== KNOWN KMS ALIASES ===="
          aws kms list-aliases \
            --region $AWS_REGION \
            --query "Aliases[?AliasName=='alias/eks/management-cluster' || AliasName=='alias/eks/dev-cluster' || AliasName=='alias/eks/prod-cluster'].AliasName" \
            --output table

          echo "==== LOAD BALANCERS ===="
          aws elbv2 describe-load-balancers \
            --region $AWS_REGION \
            --query "LoadBalancers[*].[LoadBalancerName,State.Code,DNSName]" \
            --output table || true

          echo "==== NAT GATEWAYS ===="
          aws ec2 describe-nat-gateways \
            --region $AWS_REGION \
            --query "NatGateways[*].[NatGatewayId,State]" \
            --output table || true

          echo "==== ELASTIC IPS ===="
          aws ec2 describe-addresses \
            --region $AWS_REGION \
            --query "Addresses[*].[PublicIp,AllocationId,AssociationId]" \
            --output table || true
