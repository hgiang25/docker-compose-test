name: Register Clusters To ArgoCD (GitOps)

on:
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1

jobs:
  register:
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================
      - uses: actions/checkout@v4

      # =========================================================
      # SETUP TOOLS
      # =========================================================
      - uses: azure/setup-kubectl@v4

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/

      # =========================================================
      # AWS AUTH
      # =========================================================
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # =========================================================
      # CONNECT MANAGEMENT CLUSTER
      # =========================================================
      - name: Connect Management Cluster
        run: |
          aws eks update-kubeconfig \
            --name management-cluster \
            --region $AWS_REGION

      # =========================================================
      # WAIT ARGOCD READY
      # =========================================================
      - name: Wait ArgoCD Server
        run: |
          kubectl rollout status deployment/argocd-server \
            -n argocd \
            --timeout=900s

      # =========================================================
      # GET ARGOCD ADMIN PASSWORD
      # =========================================================
      - name: Get ArgoCD Password
        run: |
          kubectl get secret argocd-initial-admin-secret \
            -n argocd \
            -o jsonpath="{.data.password}" | base64 -d

      # =========================================================
      # LOGIN ARGOCD
      # =========================================================
      - name: Login ArgoCD
        run: |
          ARGO_PWD=$(kubectl get secret argocd-initial-admin-secret \
            -n argocd \
            -o jsonpath="{.data.password}" | base64 -d)

          ARGO_HOST=$(kubectl get svc argocd-server \
            -n argocd \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

          argocd login $ARGO_HOST \
            --username admin \
            --password $ARGO_PWD \
            --insecure

      # =========================================================
      # CONNECT DEV CLUSTER
      # =========================================================
      - name: Connect Dev Cluster
        run: |
          aws eks update-kubeconfig \
            --name dev-cluster \
            --region $AWS_REGION

      # =========================================================
      # REGISTER CLUSTER TO ARGOCD
      # =========================================================
      - name: Register Dev Cluster
        run: |
          argocd cluster add arn:aws:eks:ap-southeast-1:248195880649:cluster/dev-cluster \
            --name dev-cluster \
            --yes

      # =========================================================
      # VERIFY
      # =========================================================
      - name: Verify Clusters in ArgoCD
        run: |
          argocd cluster list
